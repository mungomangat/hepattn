name: HF-1000MeV-eta2p5-posenc

data:
  # Paths to preprocessed data directories
  train_dir: /share/rcif2/mmangat/data/colliderml/ttbar/train/
  val_dir: /share/rcif2/mmangat/data/colliderml/ttbar/val/
  test_dir: /share/rcif2/mmangat/data/colliderml/ttbar/test/

  # Event process name in this directory layout
  event_type: ttbar

  # Number of events to include in each set
  num_workers: 0
  num_train: -1
  num_test: 1000
  num_val: 100

  # Minimum pT for a particle to be deemed reconstructve in GeV
  particle_min_pt: 1.0
  particle_max_abs_eta: 2.5

  # Optional per-particle-type hit-content cuts.
  # When non-empty, these override the legacy global hit cuts.
  # Supported particle keys: all, charged_hadron, neutral_hadron,
  # electron, photon, muon, tau, neutrino, other
  # Supported cut keys: min_num_sihit, min_num_ecal, min_num_hcal
  particle_hit_cuts:
    charged_hadron:
      min_num_sihit: 3
      min_num_hcal: 0
    neutral_hadron:
      min_num_hcal: 0
    electron:
      min_num_sihit: 3
      min_num_ecal: 0
    photon:
      min_num_ecal: 0
    muon:
      min_num_sihit: 3
    tau:
      min_num_sihit: 3

  # Whether to include charged / neutral particles as targets
  particle_include_charged: true
  particle_include_neutral: false

  return_calohits: false
  return_tracks: false

# Training stuff here
trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: true
  val_check_interval: 1000

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: colliderml

  callbacks:
    # - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        every_n_train_steps: 2000
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: false
        write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 10

  model:
    class_path: hepattn.models.HitFilter
    init_args:
      input_sort_field: phi

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: sihit
                fields:
                  - x
                  - y
                  - z
                  - r
                  - s
                  - eta
                  - phi
                  - layer_id
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 8
                    hidden_layers: [128]
                    output_size: &dim 256
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.PositionEncoder
                  init_args:
                    input_name: sihit
                    fields:
                      - r
                      - eta
                      - phi
                    sym_fields:
                      - phi
                    dim: *dim

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: *dim
          attn_type: flash
          window_size: 1024
          window_wrap: true
          hybrid_norm: true
          norm: FastLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.HitFilterTask
              init_args:
                name: sihit_filter
                input_object: sihit
                target_field: on_valid_particle
                dim: *dim
                threshold: 0.1
                loss_fn: bce
