seed_everything: 42
name: HF-1000MeV-eta2p5-posenc

data:
  train_dir: /share/rcif2/mmangat/data/colliderml/ttbar/train/
  val_dir: /share/rcif2/mmangat/data/colliderml/ttbar/val/
  test_dir: /share/rcif2/mmangat/data/colliderml/ttbar/test/

  event_type: ttbar
  num_workers: 8
  num_train: -1
  num_val: -1
  num_test: -1

  # Minimum pT for a charged particle to be deemed reconstructible [GeV]
  particle_min_pt: 1.0

  # Maximum |eta| for a particle to be deemed reconstructible
  particle_max_abs_eta: 2.5

  # Minimum number of pixel hits for a particle to be reconstructible
  particle_min_num_hits: 3

  # Pixel detector IDs to select (filters on the sihit `detector` field).
  pixel_detector_ids: [0, 1, 2]

trainer:
  max_epochs: 80
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: /share/rcif2/mmangat/logs/colliderml_pixel_filtering
  gradient_clip_val: 0.1
  enable_progress_bar: true
  val_check_interval: 1000

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: colliderml_pixel_filtering

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        every_n_train_steps: 2000
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: false
        write_preds: true
        write_targets: true
        write_losses: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-7
    max: 5e-5
    end: 1e-6
    pct_start: 0.05
    skip_scheduler: false
    weight_decay: 1e-5

  mtl: false

  model:
    class_path: hepattn.models.HitFilter
    init_args:
      input_sort_field: phi

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: sihit
                fields:
                  - x
                  - y
                  - z
                  - r
                  - s
                  - eta
                  - phi
                  - layer_id
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 8
                    hidden_layers: [128]
                    output_size: &dim 256
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.PositionEncoder
                  init_args:
                    input_name: sihit
                    fields:
                      - r
                      - eta
                      - phi
                    sym_fields:
                      - phi
                    dim: *dim

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: *dim
          attn_type: flash
          window_size: 1024
          window_wrap: true
          hybrid_norm: true
          norm: FastLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.HitFilterTask
              init_args:
                name: sihit_filter
                input_object: sihit
                target_field: on_valid_particle
                dim: *dim
                threshold: 0.1
                loss_fn: bce
