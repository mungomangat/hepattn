seed_everything: 42
name: colliderml-pixel-tracking

data:
  train_dir: /share/rcif2/mmangat/data/colliderml/ttbar/train/
  val_dir: /share/rcif2/mmangat/data/colliderml/ttbar/val/
  test_dir: /share/rcif2/mmangat/data/colliderml/ttbar/test/

  event_type: ttbar
  num_workers: 8
  num_train: -1
  num_val: -1
  num_test: -1

  # Minimum pT for a charged particle to be deemed reconstructible [GeV]
  particle_min_pt: 0.5

  # Maximum |eta| for a particle to be deemed reconstructible
  particle_max_abs_eta: 4.0

  # Minimum number of pixel hits for a particle to be reconstructible
  particle_min_num_hits: 3

  # Maximum number of reconstructable particles per event (sets query slot count)
  event_max_num_particles: &num_objects 1500
  strict_max_objects: false

  # Pixel detector IDs to select (filters on the sihit `detector` field).
  # 0, 1, 2 = inner silicon (r=32-174mm); 3-5 = middle (r=240-702mm); 6-8 = outer (r=820-1032mm)
  pixel_detector_ids: [0, 1, 2]

trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  log_every_n_steps: 50
  default_root_dir: logs
  gradient_clip_val: 0.1
  enable_progress_bar: true
  val_check_interval: 1000

  logger:
    class_path: hepattn.utils.loggers.MyCometLogger
    init_args:
      project: colliderml_pixel_tracking

  callbacks:
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        every_n_train_steps: 2000
    - class_path: hepattn.callbacks.PredictionWriter
      init_args:
        write_inputs: false
        write_outputs: true
        write_preds: true
        write_targets: true
        write_losses: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-7
    max: 5e-5
    end: 1e-5
    pct_start: 0.02
    skip_scheduler: false
    weight_decay: 1e-5

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 256
      input_sort_field: phi

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: sihit
                fields:
                  - x
                  - y
                  - z
                  - r
                  - s
                  - eta
                  - phi
                  - layer_id
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 8
                    hidden_layers: [128]
                    output_size: *dim
                    activation: SwiGLU
                posenc:
                  class_path: hepattn.models.PositionEncoder
                  init_args:
                    input_name: sihit
                    fields:
                      - r
                      - eta
                      - phi
                    dim: *dim

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 8
          dim: *dim
          attn_type: flash
          window_size: 512
          window_wrap: true
          hybrid_norm: true
          norm: FastLayerNorm
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}

      decoder:
        dynamic_queries: true
        dynamic_query_source: sihit
        num_decoder_layers: &num_dec_layers 3
        num_queries: *num_objects
        mask_attention: true
        use_query_masks: false
        unmask_all_false: false
        decoder_layer_config:
          dim: *dim
          norm: FastLayerNorm
          hybrid_norm: true
          dense_kwargs: {activation: SwiGLU}
          attn_kwargs: {bias: false}
          bidirectional_ca: false

      encoder_tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ClassificationTask
              init_args:
                name: query_init
                input_object: sihit
                classes: ["is_first"]
                loss_weight: 1.0
                threshold: 0.05
                permute_loss: false
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    hidden_layers: [256]
                    output_size: 1

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: track_valid
                input_object: query
                output_object: track
                target_object: particle
                has_intermediate_loss: true
                has_first_layer_loss: false
                dim: *dim
                losses:
                  object_bce: 0.1
                costs:
                  object_bce: 0.1
                null_weight: 1.0

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: track_sihit_valid
                input_constituent: sihit
                input_object: query
                output_object: track
                target_object: particle
                dim: *dim
                losses:
                  mask_dice: 2.0
                  mask_focal: 100.0
                costs:
                  mask_dice: 2.0
                  mask_focal: 100.0
                null_weight: 1.0

            - class_path: hepattn.models.task.IoUPredictionTask
              init_args:
                name: track_iou
                input_object: query
                mask_task_name: track_sihit_valid
                mask_logit_key: track_sihit_logit
                target_mask_key: particle_sihit
                dim: *dim
                loss_weight: 1.0

      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: true
          n_jobs: *num_dec_layers
          parallel_solver: true
          parallel_backend: process
